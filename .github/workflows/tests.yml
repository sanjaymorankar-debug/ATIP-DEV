name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # PostgreSQL is ATIP's server database (the VPS), so the live tests -- tests/test_postgres_backend.py,
    # tests/test_postgres_write_lock.py, tests/test_loss_rca_2026_11_19.py and tests/test_schema_sql.py --
    # run here against a real server instead of being skipped. The databases they name are dropped and
    # recreated by the tests; this one is a throwaway.
    services:
      postgres:
        # Docker Hub's official image via its AWS ECR mirror: Docker Hub rate-limits anonymous pulls.
        # 18, not 16 (23 Nov 2026): ops/backup.py uses the NEWEST pg_dump on the runner, and a dump from a
        # newer pg_dump does not restore into an older server ("unrecognized configuration parameter
        # transaction_timeout"). The server must be at least as new as the runner's client.
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATIP_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/atip_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Only what the tested modules import at module scope. yfinance is
          # here because data/markets.py imports it unguarded and the index
          # regression test reaches that module.
          #
          # cryptography is a declared runtime requirement (requirements.txt) and
          # the vault tests need it; without it ops/crypto.py cannot make a key,
          # so three W37 vault tests failed with "the vault needs an encryption
          # key" and one W38 test with ModuleNotFoundError.
          # PyYAML is a test-only dependency: the W38 container-packaging test
          # parses docker-compose.yml with it. No runtime module imports yaml,
          # so it stays out of requirements.txt.
          #
          # schedule (the in-process job timer: pipeline/scheduler.py,
          # pipeline/operating_schedule.py) and openpyxl (the XLSX report writer:
          # enterprise/session_reports.py) are declared runtime requirements;
          # without them 13 scheduler and report tests failed with
          # ModuleNotFoundError (master, 3 Nov 2026). Neither reaches a broker.
          #
          # dhanhq, kiteconnect, anthropic and the rest stay OUT deliberately —
          # every one is behind a guarded import, and no CI job should be able
          # to reach a real brokerage account.
          #
          # psycopg is the PostgreSQL driver (db/postgres.py), for the live PostgreSQL tests. The
          # backup test's pg_dump / pg_restore come from the runner image's PostgreSQL client
          # (/usr/lib/postgresql/N/bin, which ops/backup.py looks in).
          pip install pytest httpx pandas numpy ta fastapi uvicorn requests yfinance \
                      cryptography PyYAML schedule openpyxl "psycopg[binary]"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Deterministic scenario replay
        run: python -m strategy.backtest_aggressive
