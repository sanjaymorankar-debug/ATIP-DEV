[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    # FastAPI's on_event deprecation fires on import of dashboard.server. It is
    # a real thing to fix, but it is not a test failure and it drowns output.
    # (?s) is required: the message begins with a newline, and warning filters
    # match with re.match, where "." does not cross one.
    ignore:(?s).*on_event is deprecated.*:DeprecationWarning
